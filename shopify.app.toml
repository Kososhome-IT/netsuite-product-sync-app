# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2d742ace81ae8423a85e994ab0d31e39"
name = "Product Sync Netsuite"
handle = "ch-product"
application_url = "https://directions-science-css-flashers.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_metaobjects,write_metaobjects,read_products,write_products,customer_read_metaobjects,unauthenticated_read_metaobjects,read_products,write_products,read_inventory,write_inventory,write_locations,read_locations"

[auth]
redirect_urls = ["https://directions-science-css-flashers.trycloudflare.com/auth/callback", "https://directions-science-css-flashers.trycloudflare.com/auth/shopify/callback", "https://directions-science-css-flashers.trycloudflare.com/api/auth/callback"]

[pos]
embedded = false
