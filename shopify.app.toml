client_id = "2d742ace81ae8423a85e994ab0d31e39"
name = "Product Sync Netsuite"
handle = "ch-product"
application_url = "https://affected-billing-hottest-consumer.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = ["https://affected-billing-hottest-consumer.trycloudflare.com/auth/callback", "https://affected-billing-hottest-consumer.trycloudflare.com/auth/shopify/callback", "https://affected-billing-hottest-consumer.trycloudflare.com/api/auth/callback"]

[pos]
embedded = false
